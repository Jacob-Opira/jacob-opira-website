backend:
  name: github
  repo: Jacob-Opira/jacob-opira-website
  branch: main
  base_url: https://jacob.opira.se
  auth_endpoint: auth

site_url: https://jacob.opira.se
display_url: https://jacob.opira.se
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Kevin", required: false }
      - { label: "Kicker (small label above headline)", name: "kicker", widget: "string", required: false }
      - { label: "Deck / Subtitle", name: "deck", widget: "string", required: false }
      - label: "Layout Type"
        name: "layout_type"
        widget: "select"
        options:
          - { label: "Hero (Large Feature)", value: "hero" }
          - { label: "Medium (Standard)", value: "medium" }
          - { label: "Compact (Sidebar/Archive)", value: "compact" }
          - { label: "Text-Only (Opinion Strip)", value: "opinion" }
        default: "compact"
      - label: "Sections (departments, pick one or more)"
        name: "sections"
        widget: "relation"
        collection: "sections"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
      - { label: "Tags (separate with commas)", name: "topics", widget: "list", required: false }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "sections"
    label: "Sections (departments)"
    folder: "src/sections"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "One-line description", name: "description", widget: "string", required: false }
      - { label: "Position in navigation (lower = further left)", name: "order", widget: "number", value_type: "int", default: 10, min: 0, required: false }
      - { label: "Show in navigation", name: "show_in_nav", widget: "boolean", default: true }
      - { label: "Intro text (optional)", name: "body", widget: "markdown", required: false }
