backend:
  name: github
  repo: Jacob-Opira/jacob-opira-website
  branch: main
  base_url: https://jacob.opira.se
  auth_endpoint: auth

site_url: https://jacob.opira.se
display_url: https://jacob.opira.se
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Kevin", required: false }
      - { label: "Kicker (small label above headline)", name: "kicker", widget: "string", required: false }
      - { label: "Deck / Subtitle", name: "deck", widget: "string", required: false }
      - label: "Layout Type"
        name: "layout_type"
        widget: "select"
        options:
          - { label: "Hero (Large Feature)", value: "hero" }
          - { label: "Medium (Standard)", value: "medium" }
          - { label: "Compact (Sidebar/Archive)", value: "compact" }
          - { label: "Text-Only (Opinion Strip)", value: "opinion" }
        default: "compact"
      - label: "Section Placement"
        name: "section"
        widget: "select"
        options:
          - { label: "Front Page Lead", value: "frontpage" }
          - { label: "Essays & Dispatches", value: "essays" }
          - { label: "Philosophy & Inquiry", value: "philosophy" }
          - { label: "Archive / Deep Storage", value: "archive" }
        default: "archive"
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
