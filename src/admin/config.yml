backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"
relative_path: true

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "src/articles"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Standfirst / deck", name: "deck", widget: "text", required: false, hint: "The one- or two-sentence summary shown under the headline." }
      - { label: "Author", name: "author", widget: "string", default: "The Dispatch", required: false }
      - { label: "Lead story on front page?", name: "featured", widget: "boolean", default: false, hint: "Only one article should be marked as the lead at a time. If none are marked, the most recent article becomes the lead automatically." }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Image caption / alt text", name: "image_alt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
